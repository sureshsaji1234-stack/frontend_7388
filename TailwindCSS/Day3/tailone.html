<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-white px-6 py-4 border-b">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">DECATHLON</h1>

        <input
            type="text"
            placeholder="Search products"
            class="border border-gray-400 rounded-full px-5 py-3 w-190"
        >

        <div class="flex gap-6">
            <a href="#" class="text-gray-700">Men</a>
            <a href="#" class="text-gray-700">Women</a>
            <a href="#" class="text-gray-700">Kids</a>
            <a href="#" class="text-gray-700">Sports</a>
        </div>
    </div>
</nav>

<section class="p-6">
    <div class="flex overflow-x-auto snap-x snap-mandatory gap-4 rounded-xl">
        <div class="min-w-full snap-center">
            <img
                src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=80"
                class="w-full h-80 object-cover rounded-xl"
                alt="Fitness"
            >
        </div>

        <div class="min-w-full snap-center">
            <img
                src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=1400&q=80"
                class="w-full h-80 object-cover rounded-xl"
                alt="Running"
            >
        </div>

        <div class="min-w-full snap-center">
            <img
                src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1400&q=80"
                class="w-full h-80 object-cover rounded-xl"
                alt="Workout"
            >
        </div>
    </div>
</section>

<section class="px-6 py-8">
    <h2 class="text-2xl font-bold text-center mb-6">
        Popular Products
    </h2>

    <div class="flex flex-wrap justify-center gap-6">

        <div class="bg-white border rounded-xl p-4 w-64">
            <img
                src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=500&q=80"
                class="w-full h-40 object-cover rounded-lg"
                alt="Running Shoes"
            >
            <h3 class="text-xl font-bold mt-3">Running Shoes</h3>
            <p class="text-gray-600 mt-2">Comfortable running shoes</p>
            <p class="font-bold mt-2">₹1,499</p>
        </div>

        <div class="bg-white border rounded-xl p-4 w-64">
            <img
                src="https://images.unsplash.com/photo-1579758629938-03607ccdbaba?auto=format&fit=crop&w=500&q=80"
                class="w-full h-40 object-cover rounded-lg"
                alt="Yoga Mat"
            >
            <h3 class="text-xl font-bold mt-3">Yoga Mat</h3>
            <p class="text-gray-600 mt-2">Perfect for yoga and fitness</p>
            <p class="font-bold mt-2">₹699</p>
        </div>

        <div class="bg-white border rounded-xl p-4 w-64">
            <img
                src="https://images.unsplash.com/photo-1576678927484-cc907957088c?auto=format&fit=crop&w=500&q=80"
                class="w-full h-40 object-cover rounded-lg"
                alt="Dumbbells"
            >
            <h3 class="text-xl font-bold mt-3">Dumbbells</h3>
            <p class="text-gray-600 mt-2">For strength training</p>
            <p class="font-bold mt-2">₹999</p>
        </div>

        <div class="bg-white border rounded-xl p-4 w-64">
            <img
                src="https://images.unsplash.com/photo-1599586120429-48281b6f0ece?auto=format&fit=crop&w=500&q=80"
                class="w-full h-40 object-cover rounded-lg"
                alt="Sports Bag"
            >
            <h3 class="text-xl font-bold mt-3">Sports Bag</h3>
            <p class="text-gray-600 mt-2">Carry your sports equipment</p>
            <p class="font-bold mt-2">₹799</p>
        </div>

    </div>
</section>

</body>
</html>
