<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Food Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Contact Us</h2>
    <p>Have questions or feedback? Fill out the form below and we'll get back to you soon!</p>
    <form action="submit-contact" method="post">
        <label for="name"> Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" cols="30" required></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>
    <footer>
        <p>&copy; 2026 Food Delivery. All rights reserved.</p>
    </footer>
    <div>
        <a href="Index.html">Back to Home</a>
    </div>
</body>
</html>
