<!DOCTYPE html>

<html>
<head>
    <title>CSS Classroom Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<h1 class="text-center p-3 m-3 bg-primary text-white rounded border">CSS Class</h1>

<div class="m-3 p-3 bg-white rounded border">
    <h2 class="p-2 bg-info rounded border">Teacher Information</h2>
    <p class="p-2 m-2 bg-light rounded border">Teacher Name: Mr. Ravi</p>
    <p class="p-2 m-2 bg-light rounded border">Subject: CSS</p>
</div>

<div class="m-3 p-3 bg-white rounded border">
    <h2 class="p-2 bg-info rounded border">Student Information</h2>
    <p class="p-2 m-2 bg-light rounded border">Arun</p>
    <p class="p-2 m-2 bg-light rounded border">Priya</p>
    <p class="p-2 m-2 bg-light rounded border">Kumar</p>
    <p class="p-2 m-2 bg-light rounded border">Divya</p>
</div>

<div class="m-3 p-3 bg-white rounded border">
    <h2 class="p-2 bg-info rounded border">Today's Topics</h2>
    <p class="p-2 m-2 bg-light rounded border">HTML</p>
    <p class="p-2 m-2 bg-light rounded border">CSS</p>
    <p class="p-2 m-2 bg-light rounded border">JavaScript</p>
</div>

<div class="m-3 p-3 bg-white rounded border">
    <h2 class="p-2 bg-info rounded border">Class Status</h2>
    <p class="p-2 m-2 bg-light rounded border">Class Started</p>
    <p class="p-2 m-2 bg-light rounded border">Class In Progress</p>
    <p class="p-2 m-2 bg-light rounded border">Class Completed</p>
</div>
</body>
</html>
